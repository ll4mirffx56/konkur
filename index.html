<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1017"><title>Academic OS</title>
<style>
:root{--bg:#080d13;--panel:#101821;--panel2:#121d28;--line:#243342;--text:#edf3f8;--muted:#8ea0b2;--blue:#3b91ff;--cyan:#27d1c1;--green:#32c58a;--yellow:#eec65c;--orange:#ff9d43;--red:#ff5d6c;--purple:#9a86ff;--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:224px;background:#091019;border-left:1px solid var(--line);padding:18px 12px;z-index:20}.brand{padding:6px 9px 20px;font-weight:800}.brand small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.nav{display:grid;gap:4px}.nav button,.mobile-nav button{border:0;background:none;color:#9eafc0;text-align:right;border-radius:10px;padding:10px 11px}.nav button.active,.nav button:hover{background:#132337;color:#fff}.main{margin-right:224px}.top{height:66px;position:sticky;top:0;z-index:15;background:rgba(8,13,19,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:15px;margin:0}.top small{color:var(--muted)}.content{max-width:1380px;margin:auto;padding:22px 24px 50px}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.page-head h2{margin:0;font-size:23px}.page-head p{margin:6px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{background:#101923;color:#dce7f0;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.btn:hover{background:#152331}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#ff9da6}.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(180deg,#111b25,#0d151e);border:1px solid var(--line);border-radius:var(--r);padding:16px}.card h3{font-size:13px;margin:0 0 13px}.muted{color:var(--muted)}.small{font-size:11px}.hero{background:radial-gradient(circle at 10% 10%,#16385a55,transparent 38%),linear-gradient(135deg,#101d2b,#0d151e)}.hero-title{font-size:28px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.kpi{padding:13px;border:1px solid var(--line);border-radius:11px;background:#0d151e}.kpi b{font-size:21px}.kpi small{display:block;color:var(--muted);margin-top:4px}.mission{display:grid;gap:8px}.task{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-right:3px solid var(--blue);border-radius:11px;padding:11px;background:#101923}.task.must{border-right-color:var(--red)}.task.should{border-right-color:var(--yellow)}.task.could{border-right-color:var(--cyan)}.task.done{opacity:.5}.task b{font-size:12px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:10px;color:#b9c8d5}.pill.green{color:#7ae5b8}.pill.yellow{color:#ffe08b}.pill.red{color:#ff9da6}.pill.blue{color:#8ec5ff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:7px;background:#202c38;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.course-list{display:grid;gap:9px}.course{padding:12px;border:1px solid var(--line);border-radius:11px;background:#0e171f}.course-top{display:flex;justify-content:space-between;gap:8px}.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #1d2935;font-size:11px;text-align:right}.table th{color:#91a5b8;background:#0b131c}.table tr:last-child td{border:0}.chart{height:170px;display:flex;align-items:flex-end;gap:7px;padding:12px 2px 20px}.col{flex:1;background:linear-gradient(180deg,var(--blue),#174c82);border-radius:6px 6px 2px 2px;position:relative;min-width:6px}.col span{position:absolute;bottom:-17px;right:50%;transform:translateX(50%);font-size:9px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:92px;border:1px solid var(--line);border-radius:9px;padding:7px;background:#0d151e}.day.today{border-color:var(--blue)}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-left:3px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field label{font-size:10px;color:#9badbe}.field input,.field select,.field textarea{width:100%;background:#091119;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;outline:none}.field textarea{min-height:90px;resize:vertical}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.modal.show{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#101923;border:1px solid #34475a;border-radius:16px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:none;color:#9fb1c2;font-size:23px}.toast{position:fixed;bottom:20px;left:20px;background:#142435;border:1px solid #34516c;padding:10px 13px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:100}.toast.show{opacity:1;transform:none}.mobile-menu{display:none}.mobile-nav{display:none}.empty{text-align:center;padding:30px;color:var(--muted)}.list{display:grid;gap:8px}.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px}.setting-section{margin-bottom:13px}.hint{padding:11px;border-right:3px solid var(--purple);background:#121727;border-radius:9px;font-size:11px}.hide{display:none}.progress-note{font-size:10px;color:var(--muted);margin-top:5px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.side{display:none}.side.open{display:block;width:260px;box-shadow:0 0 50px #000}.main{margin:0;padding-bottom:64px}.top{padding:0 13px}.mobile-menu{display:block;background:#101923;color:#fff;border:1px solid var(--line);border-radius:8px;padding:7px}.top .mobile-menu+div{display:none}.content{padding:16px 12px 30px}.g2,.g3,.g4{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:grid;position:fixed;bottom:0;right:0;left:0;height:60px;background:#091019;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:30}.mobile-nav button{text-align:center;font-size:9px}.page-head{align-items:flex-start;flex-direction:column}.hero-title{font-size:22px}}
</style></head><body>
<div class="app"><aside class="side" id="side"><div class="brand">📊 Amir's Academic OS<small>سیستم مدیریت کنکور ۱۴۰۶</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><button class="mobile-menu" onclick="toggleSide()">☰</button><div><h1 id="topTitle">داشبورد</h1><small id="dateLabel"></small></div><div class="actions"><button class="btn" onclick="quickAdd()">＋ ثبت سریع</button></div></header><div class="content" id="content"></div></main><nav class="mobile-nav" id="mnav"></nav></div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='amir-academic-os-v3';
const base={settings:{name:'امیر',exam:'کنکور ۱۴۰۶',target:'رتبه زیر ۱۰۰',university:'مهندسی کامپیوتر شریف',finalAvg:'۱۹.۵+'},subjects:[
{id:'chem',name:'شیمی',teacher:'فراهانی',priority:1,video:9,learning:5,total:29,hours:110,color:'#27d1c1'},
{id:'phys',name:'فیزیک',teacher:'براتی',priority:1,video:0,learning:0,total:15,hours:70,color:'#3b91ff'},
{id:'calc',name:'حسابان',teacher:'معین کرمی',priority:2,video:0,learning:0,total:35,hours:120,color:'#9a86ff'},
{id:'geo',name:'هندسه و گسسته',teacher:'جلالی',priority:2,video:0,learning:0,total:9,hours:15,color:'#eec65c'}],tasks:[
{id:1,title:'شیمی — جلسه ۱۰',subject:'chem',type:'یادگیری جدید',priority:'MUST',done:false,output:'ویدئو + تست آموزشی'},
{id:2,title:'فیزیک — جلسه ۱',subject:'phys',type:'یادگیری جدید',priority:'SHOULD',done:false,output:'ویدئو + تست آموزشی'},
{id:3,title:'مرور تشریحی',subject:'',type:'مرور',priority:'COULD',done:false,output:'مرور نکات'}],tests:[],debts:[],logs:[],notes:[],mistakes:[],goals:[{id:1,title:'رتبه زیر ۱۰۰',level:'سالانه',status:'فعال'},{id:2,title:'اتمام شیمی + فیزیک',level:'ماهانه',status:'فعال'},{id:3,title:'۷ جلسه در هفته',level:'هفتگی',status:'فعال'}],reviews:[],constraints:[]};
let db=load(),route=location.hash.slice(1)||'home';
function load(){try{return {...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(base)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function subject(id){return db.subjects.find(s=>s.id===id)} function sname(id){return subject(id)?.name||'—'}
function today(){return new Intl.DateTimeFormat('fa-IR',{dateStyle:'full'}).format(new Date())}
const navItems=[['home','🏠','خانه'],['today','📋','امروز'],['courses','📚','دروس و دوره‌ها'],['tests','🧪','تست‌ها'],['analytics','📊','تحلیل'],['calendar','📅','تقویم'],['debt','⚠️','بدهی‌ها'],['reviews','🔄','مرورها'],['goals','🎯','اهداف'],['notes','📝','یادداشت‌ها'],['mistakes','⚑','دفتر اشتباهات'],['settings','⚙️','تنظیمات']];
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${route===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');document.getElementById('mnav').innerHTML=navItems.slice(0,5).map(x=>`<button onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}
function go(r){route=r;location.hash=r;render();document.getElementById('side').classList.remove('open')}
function shell(title,sub,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function progress(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function totalTests(){return db.tests.reduce((a,x)=>a+x.q,0)} function accuracy(){let q=totalTests();return q?Math.round(db.tests.reduce((a,x)=>a+x.c,0)/q*100):0}
function home(){let done=db.tasks.filter(x=>x.done).length, exec=db.tasks.length?Math.round(done/db.tasks.length*100):0;return shell('خانه','وضعیت واقعی مسیرت، بدون شلوغی و اطلاعات اضافی.')+`<div class="card hero"><div class="row"><div><div class="small muted">${esc(db.settings.exam)} · هدف اصلی</div><div class="hero-title">${esc(db.settings.target)}</div><div class="small muted">${esc(db.settings.university)} · معدل ${esc(db.settings.finalAvg)}</div></div><span class="pill blue">وضعیت هفته</span></div><div class="kpis"><div class="kpi"><b>${studyHours()}</b><small>ساعت مطالعه</small></div><div class="kpi"><b>${done}</b><small>جلسه/کار انجام‌شده</small></div><div class="kpi"><b>${totalTests()}</b><small>تست</small></div><div class="kpi"><b>${exec}%</b><small>اجرای برنامه</small></div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><h3>ماموریت امروز</h3>${mission()}</div><div class="card"><h3>پیشرفت دروس</h3><div class="course-list">${db.subjects.map(c=>courseMini(c)).join('')}</div></div></div><div class="grid g3" style="margin-top:13px"><div class="card"><h3>وضعیت هفته</h3><div class="row"><b>۵ / ۷ جلسه</b><span class="pill yellow">۷۱٪</span></div><div class="bar"><i style="width:71%"></i></div><p class="small muted">هدف هفته بر اساس ظرفیت واقعی تنظیم می‌شود.</p></div><div class="card"><h3>بدهی تحصیلی</h3><div class="row"><b>${db.debts.filter(x=>x.status!=='Done').length}</b><span class="muted small">باز</span></div><p class="small muted">فقط بدهی‌های مهم را وارد برنامه کن؛ همه‌چیز را به فردا منتقل نکن.</p></div><div class="card"><h3>🧠 Coach Insight</h3><div class="hint">${coach()}</div></div></div>`}
function mission(){if(!db.tasks.length)return '<div class="empty">امروز کاری ثبت نشده است.</div>';return `<div class="mission">${db.tasks.map(t=>`<div class="task ${t.priority.toLowerCase()} ${t.done?'done':''}"><div><b>${t.title}</b><div class="small muted">${t.type} · خروجی: ${t.output||'—'}</div></div><div class="actions"><span class="pill ${t.priority==='MUST'?'red':t.priority==='SHOULD'?'yellow':'blue'}">${t.priority}</span><button class="btn" onclick="toggleTask(${t.id})">${t.done?'بازگردانی':'انجام شد'}</button></div></div>`).join('')}</div>`}
function courseMini(c){let vp=progress(c.video,c.total),lp=progress(c.learning,c.total);return `<div class="course"><div class="course-top"><div><b>${esc(c.name)}</b><div class="small muted">دبیر: ${esc(c.teacher||'بدون دبیر')} · اولویت ${c.priority}</div></div><span class="pill">${c.video}/${c.total}</span></div><div class="dual"><div><div class="row small"><span>ویدئو</span><b>${vp}%</b></div><div class="bar"><i style="width:${vp}%"></i></div></div><div><div class="row small"><span>یادگیری</span><b>${lp}%</b></div><div class="bar"><i style="width:${lp}%;background:var(--green)"></i></div></div></div>${c.video-c.learning>0?`<div class="progress-note">فاصله تثبیت: ${c.video-c.learning} جلسه</div>`:''}</div>`}
function courses(){return shell('دروس و دوره‌ها','اطلاعات درس، دبیر، جلسات و پیشرفت را خودت کنترل کن.',`<button class="btn primary" onclick="editCourse()">＋ افزودن درس</button><button class="btn" onclick="manageTeachers()">مدیریت دبیرها</button>`)+`<div class="grid g2">${db.subjects.map(c=>`<div class="card"><div class="row"><div><h3>${esc(c.name)}</h3><span class="small muted">دبیر: ${esc(c.teacher||'—')} · ${c.total} جلسه · حدود ${c.hours} ساعت</span></div><div class="actions"><span class="pill">P${c.priority}</span><button class="btn" onclick="editCourse('${c.id}')">ویرایش</button></div></div>${courseMini(c)}<div class="actions" style="margin-top:10px"><button class="btn" onclick="changeProgress('${c.id}','video')">＋ ویدئو</button><button class="btn" onclick="changeProgress('${c.id}','learning')">＋ یادگیری</button><button class="btn danger" onclick="removeCourse('${c.id}')">حذف</button></div></div>`).join('')}</div>`}
function tests(){return shell('تست‌ها','ثبت سریع تست و دیدن کیفیت عملکرد؛ درصد تنها معیار نیست.',`<button class="btn primary" onclick="testModal()">＋ ثبت تست</button>`)+`<div class="grid g4"><div class="card"><b class="stat">${totalTests()}</b><div class="small muted">کل تست</div></div><div class="card"><b class="stat">${accuracy()}٪</b><div class="small muted">دقت کلی</div></div><div class="card"><b class="stat">${db.tests.reduce((a,x)=>a+x.w,0)}</b><div class="small muted">غلط</div></div><div class="card"><b class="stat">${db.tests.reduce((a,x)=>a+x.b,0)}</b><div class="small muted">نزده</div></div></div><div class="card" style="margin-top:13px"><div class="table-wrap"><table class="table"><thead><tr><th>تاریخ</th><th>درس</th><th>مبحث</th><th>نوع</th><th>تعداد</th><th>دقت</th><th>علت خطا</th></tr></thead><tbody>${db.tests.length?db.tests.map(x=>`<tr><td>${x.date}</td><td>${sname(x.subject)}</td><td>${esc(x.topic)}</td><td>${x.type}</td><td>${x.q}</td><td>${x.q?Math.round(x.c/x.q*100):0}٪</td><td>${x.cause||'—'}</td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">هنوز تستی ثبت نشده است.</div></td></tr>'}</tbody></table></div></div>`}
function analytics(){let vals=[2,4,3,6,5,7,5];return shell('تحلیل','فقط شاخص‌هایی که به تصمیم‌گیری کمک می‌کنند.',`<span class="pill blue">۳۰ روز اخیر</span>`)+`<div class="grid g2"><div class="card"><h3>روند جلسات</h3><div class="chart">${vals.map((v,i)=>`<div class="col" style="height:${v*18}px"><span>${i+1}</span></div>`).join('')}</div></div><div class="card"><h3>روند تست</h3><div class="chart">${[25,38,31,45,43,60,52].map((v,i)=>`<div class="col" style="height:${v*2}px"><span>${i+1}</span></div>`).join('')}</div></div></div><div class="grid g3" style="margin-top:13px"><div class="card"><h3>وضعیت یادگیری</h3>${db.subjects.map(c=>`<div style="margin:12px 0"><div class="row small"><span>${c.name}</span><b>${progress(c.learning,c.total)}٪</b></div><div class="bar"><i style="width:${progress(c.learning,c.total)}%;background:var(--green)"></i></div></div>`).join('')}</div><div class="card"><h3>ضعف‌های فعلی</h3><div class="list"><div class="list-item"><span>استوکیومتری</span><span class="pill red">نیازمند Repair</span></div><div class="list-item"><span>محاسبات</span><span class="pill yellow">تکرارشونده</span></div><div class="list-item"><span>بی‌دقتی</span><span class="pill">قابل کنترل</span></div></div></div><div class="card"><h3>ظرفیت</h3><div class="stat">۷</div><div class="small muted">جلسه هدف هفتگی</div><p class="small muted">بر مبنای میانگین چند هفته‌ای؛ یک روز عالی ظرفیت را ناگهان بالا نمی‌برد.</p></div></div>`}
function calendar(){let now=new Date(),days=[];let first=new Date(now.getFullYear(),now.getMonth(),1).getDay();for(let i=0;i<first;i++)days.push('');for(let d=1;d<=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();d++)days.push(d);return shell('تقویم','روزهای مدرسه، مطالعه، آزمون و محدودیت‌ها را یکجا ببین.')+`<div class="card"><div class="calendar">${days.map(d=>`<div class="day ${d===now.getDate()?'today':''}">${d?`<b>${d}</b><div class="small" style="margin-top:10px">${d%5===0?'🧪 تست':d%3===0?'📚 مطالعه':''}</div>`:''}</div>`).join('')}</div></div>`}
function debt(){let open=db.debts.filter(x=>x.status!=='Done');return shell('بدهی تحصیلی','بدهی را کنترل کن؛ برنامه را با بدهی‌ها خفه نکن.',`<button class="btn primary" onclick="debtModal()">＋ افزودن بدهی</button>`)+`<div class="grid g3"><div class="card"><b class="stat">${open.filter(x=>x.priority==='Critical').length}</b><div class="small muted">بحرانی</div></div><div class="card"><b class="stat">${open.filter(x=>x.priority==='Important').length}</b><div class="small muted">مهم</div></div><div class="card"><b class="stat">${open.filter(x=>x.priority==='Low').length}</b><div class="small muted">کم‌اهمیت</div></div></div><div class="card" style="margin-top:13px"><div class="table-wrap"><table class="table"><thead><tr><th>درس</th><th>کار</th><th>اولویت</th><th>مهلت</th><th>سختی</th><th>اقدام</th></tr></thead><tbody>${open.length?open.map(x=>`<tr><td>${sname(x.subject)}</td><td>${esc(x.task)}</td><td>${x.priority}</td><td>${esc(x.deadline)}</td><td>${x.difficulty}/5</td><td><button class="btn" onclick="resolveDebt(${x.id})">حل شد</button></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">بدهی بازی وجود ندارد.</div></td></tr>'}</tbody></table></div></div>`}
function goals(){return shell('اهداف و نقشه راه','هر کار باید به یک هدف بزرگ‌تر وصل باشد.')+`<div class="grid g2"><div class="card"><h3>سلسله‌مراتب هدف</h3><div class="list">${db.goals.map(g=>`<div class="list-item"><div><b>${esc(g.title)}</b><div class="small muted">${g.level}</div></div><span class="pill green">${g.status}</span></div>`).join('')}</div></div><div class="card"><h3>Roadmap</h3><div class="list"><div class="list-item">فاز ۱ · شیمی + فیزیک <span class="pill green">فعال</span></div><div class="list-item">فاز ۲ · حسابان + هندسه + گسسته <span class="pill">بعدی</span></div><div class="list-item">فاز ۳ · تست + مرور + آزمون <span class="pill">بعداً</span></div><div class="list-item">فاز ۴ · امتحانات نهایی <span class="pill">بعداً</span></div></div></div></div>`}
function reviews(){return shell('مرورها','مرور بر اساس وضعیت واقعی یادگیری، نه تقویم کور.')+`<div class="grid g2"><div class="card"><h3>مرورهای نزدیک</h3><div class="list"><div class="list-item">شیمی · Session 6 <span class="pill yellow">۲۴ ساعت</span></div><div class="list-item">فیزیک · مفاهیم پایه <span class="pill">۳ روز</span></div><div class="list-item">استوکیومتری <span class="pill red">زودتر مرور شود</span></div></div></div><div class="card"><h3>منطق مرور</h3><div class="hint">مبحث ضعیف زودتر برمی‌گردد؛ مبحث پایدار فاصله مرور بیشتری می‌گیرد. هدف، تثبیت است نه پر کردن تقویم.</div></div></div>`}
function notes(){return shell('یادداشت‌ها','نکات، فرمول‌ها و نکات تستی را کوتاه نگه دار.',`<button class="btn primary" onclick="noteModal()">＋ یادداشت</button>`)+`<div class="grid g3">${db.notes.length?db.notes.map(n=>`<div class="card"><span class="pill blue">${sname(n.subject)}</span><h3 style="margin-top:10px">${esc(n.title)}</h3><p class="small muted">${esc(n.body)}</p></div>`).join(''):'<div class="card" style="grid-column:1/-1"><div class="empty">هنوز یادداشتی ثبت نشده.</div></div>'}</div>`}
function mistakes(){return shell('دفتر اشتباهات','اشتباهات باز، ترمیم‌شده و تکرارشونده.')+`<div class="grid g3"><div class="card"><b class="stat">${db.mistakes.filter(x=>x.status==='Open').length}</b><div class="small muted">باز</div></div><div class="card"><b class="stat">${db.mistakes.filter(x=>x.status==='Repaired').length}</b><div class="small muted">ترمیم‌شده</div></div><div class="card"><b class="stat">${db.mistakes.filter(x=>x.recurring).length}</b><div class="small muted">تکرارشونده</div></div></div>`}
function todayPage(){return shell('امروز','فقط اجرای امروز؛ بدون حواس‌پرتی.')+`<div class="grid g2"><div class="card"><h3>ماموریت امروز</h3>${mission()}</div><div class="card"><h3>ثبت سریع</h3><p class="small muted">بعد از هر فعالیت فقط خروجی واقعی را ثبت کن. جزئیات اضافی اختیاری هستند.</p><button class="btn primary" onclick="quickAdd()">＋ ثبت فعالیت</button></div></div>`}
function settings(){return shell('تنظیمات','اینجا اطلاعات ثابت و قابل تغییر سیستم را خودت مدیریت می‌کنی.')+`<div class="grid g2"><div class="card setting-section"><h3>پروفایل و هدف</h3><div class="form-grid"><div class="field"><label>نام</label><input id="setName" value="${esc(db.settings.name)}"></div><div class="field"><label>هدف رتبه</label><input id="setTarget" value="${esc(db.settings.target)}"></div><div class="field"><label>دانشگاه / رشته</label><input id="setUni" value="${esc(db.settings.university)}"></div><div class="field"><label>معدل هدف</label><input id="setAvg" value="${esc(db.settings.finalAvg)}"></div></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">ذخیره</button></div><div class="card"><h3>دروس و دبیرها</h3><p class="small muted">نام درس، دبیر، تعداد جلسه، ساعت و اولویت کاملاً قابل تغییر است.</p><button class="btn primary" onclick="editCourse()">＋ افزودن / ویرایش درس</button><button class="btn" style="margin-right:6px" onclick="manageTeachers()">مدیریت دبیرها</button></div></div><div class="card" style="margin-top:13px"><h3>پشتیبان‌گیری</h3><div class="actions"><button class="btn primary" onclick="exportData()">خروجی JSON</button><button class="btn" onclick="document.getElementById('import').click()">بازیابی JSON</button><input id="import" class="hide" type="file" accept="application/json" onchange="importData(event)"><button class="btn danger" onclick="resetData()">بازنشانی همه اطلاعات</button></div><p class="small muted">داده‌ها روی همین مرورگر ذخیره می‌شوند. برای انتقال یا بکاپ، خروجی JSON بگیر.</p></div>`}
function execute(){return ({home,today:todayPage,courses,tests,analytics,calendar,debt,reviews,goals,notes,mistakes,settings}[route]||home)()}
function coach(){let gap=db.subjects.reduce((a,c)=>a+Math.max(0,c.video-c.learning),0);return gap>=4?`فاصله ویدئو و یادگیری ${gap} جلسه است. فعلاً سرعت دیدن ویدئو را زیاد نکن؛ تثبیت و تست را بالا ببر.`:'فعلاً نشانه‌ای از عقب‌ماندگی شدید دیده نمی‌شود. Target هفته بعد را فقط با میانگین چند هفته تعیین کن.'}
function studyHours(){return (db.logs.reduce((a,x)=>a+(+x.duration||0),0)/60).toFixed(1)+'h'}
function toggleTask(id){let t=db.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render();toast(t.done?'انجام شد ✓':'باز شد')}}
function changeProgress(id,type){let c=subject(id);if(!c)return;if(type==='video')c.video=Math.min(c.total,c.video+1);else c.learning=Math.min(c.total,c.learning+1);save();render();toast('پیشرفت ذخیره شد')}
function editCourse(id){let c=subject(id)||{id:'s'+Date.now(),name:'',teacher:'',priority:2,video:0,learning:0,total:1,hours:0,color:'#3b91ff'};openModal(id?'ویرایش درس':'افزودن درس',`<form class="form" onsubmit="saveCourse('${c.id}');return false"><div class="form-grid"><div class="field"><label>نام درس</label><input id="cn" value="${esc(c.name)}" required></div><div class="field"><label>دبیر</label><input id="ct" value="${esc(c.teacher||'')}" list="teachers"><datalist id="teachers">${[...new Set(db.subjects.map(x=>x.teacher).filter(Boolean))].map(t=>`<option>${esc(t)}</option>`).join('')}</datalist></div><div class="field"><label>اولویت</label><select id="cp"><option ${c.priority==1?'selected':''}>1</option><option ${c.priority==2?'selected':''}>2</option><option ${c.priority==3?'selected':''}>3</option></select></div><div class="field"><label>تعداد جلسات</label><input id="ctotal" type="number" min="1" value="${c.total}"></div><div class="field"><label>مدت تقریبی دوره (ساعت)</label><input id="ch" type="number" value="${c.hours}"></div><div class="field"><label>ویدئوی دیده‌شده</label><input id="cv" type="number" min="0" value="${c.video}"></div><div class="field"><label>یادگیری تثبیت‌شده</label><input id="cl" type="number" min="0" value="${c.learning}"></div></div><div class="actions"><button class="btn primary">ذخیره</button><button type="button" class="btn" onclick="closeModal()">لغو</button></div></form>`)}
function saveCourse(id){let c=subject(id),data={name:cn.value.trim()||'بدون نام',teacher:ct.value.trim(),priority:+cp.value,total:Math.max(1,+ctotal.value||1),hours:+ch.value||0,video:Math.min(+ctotal.value||1,Math.max(0,+cv.value||0)),learning:Math.min(+ctotal.value||1,Math.max(0,+cl.value||0))};if(c)Object.assign(c,data);else db.subjects.push({id,name:data.name,...data});save();closeModal();render();toast('درس ذخیره شد ✓')}
function removeCourse(id){if(confirm('این درس حذف شود؟')){db.subjects=db.subjects.filter(x=>x.id!==id);save();render()}}
function manageTeachers(){let teachers=[...new Set(db.subjects.map(x=>x.teacher).filter(Boolean))];openModal('مدیریت دبیرها',`<p class="small muted">برای تغییر دبیر، کافی است در ویرایش هر درس نام جدید را بنویسی. این لیست از درس‌ها ساخته می‌شود.</p><div class="list">${teachers.length?teachers.map(t=>`<div class="list-item"><b>${esc(t)}</b><span class="pill">${db.subjects.filter(x=>x.teacher===t).length} درس</span></div>`).join(''):'<div class="empty">دبیری ثبت نشده.</div>'}</div>`)}
function testModal(){openModal('ثبت تست',`<form class="form" onsubmit="addTest();return false"><div class="form-grid"><div class="field"><label>درس</label><select id="ts">${db.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>مبحث</label><input id="tt" placeholder="مثلاً استوکیومتری"></div><div class="field"><label>نوع تست</label><select id="ty"><option>آموزشی</option><option>پوششی</option><option>مبحثی</option><option>آزمون جامع</option></select></div><div class="field"><label>تعداد</label><input id="tq" type="number" value="20"></div><div class="field"><label>درست</label><input id="tc" type="number" value="14"></div><div class="field"><label>غلط</label><input id="tw" type="number" value="4"></div><div class="field"><label>نزده</label><input id="tb" type="number" value="2"></div><div class="field"><label>علت خطا</label><select id="cause"><option>مفهومی</option><option>محاسباتی</option><option>بی‌دقتی</option><option>حفظی</option><option>بدخوانی</option><option>مدیریت زمان</option></select></div></div><div class="actions"><button class="btn primary">ثبت</button><button type="button" class="btn" onclick="closeModal()">لغو</button></div></form>`)}
function addTest(){db.tests.unshift({id:Date.now(),date:new Intl.DateTimeFormat('fa-IR').format(new Date()),subject:ts.value,topic:tt.value||'بدون مبحث',type:ty.value,q:+tq.value||0,c:+tc.value||0,w:+tw.value||0,b:+tb.value||0,cause:cause.value});save();closeModal();render();toast('تست ثبت شد ✓')}
function debtModal(){openModal('افزودن بدهی',`<form class="form" onsubmit="addDebt();return false"><div class="form-grid"><div class="field"><label>درس</label><select id="ds">${db.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>اولویت</label><select id="dp"><option>Critical</option><option>Important</option><option>Low</option></select></div><div class="field"><label>کار</label><input id="dt" placeholder="مرور Session 6"></div><div class="field"><label>مهلت</label><input id="dd" placeholder="این هفته"></div></div><div class="actions"><button class="btn primary">ثبت</button></div></form>`)}
function addDebt(){db.debts.unshift({id:Date.now(),subject:ds.value,priority:dp.value,task:dt.value||'بدهی تحصیلی',deadline:dd.value||'این هفته',difficulty:3,status:'Open'});save();closeModal();render();toast('بدهی ثبت شد')}
function resolveDebt(id){let d=db.debts.find(x=>x.id===id);if(d){d.status='Done';save();render()}}
function noteModal(){openModal('یادداشت جدید',`<form class="form" onsubmit="addNote();return false"><div class="form-grid"><div class="field"><label>درس</label><select id="ns">${db.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>عنوان</label><input id="nt" required></div></div><div class="field"><label>متن</label><textarea id="nb"></textarea></div><div class="actions"><button class="btn primary">ذخیره</button></div></form>`)}
function addNote(){db.notes.unshift({id:Date.now(),subject:ns.value,title:nt.value,body:nb.value});save();closeModal();render();toast('یادداشت ذخیره شد')}
function quickAdd(){openModal('ثبت سریع',`<form class="form" onsubmit="addLog();return false"><div class="field"><label>عنوان فعالیت</label><input id="lt" placeholder="شیمی — Session 10" required></div><div class="form-grid"><div class="field"><label>مدت (دقیقه)</label><input id="ld" type="number" value="90"></div><div class="field"><label>نوع</label><select id="ly"><option>جلسه</option><option>مرور</option><option>تکلیف</option><option>آزمون</option></select></div></div><div class="actions"><button class="btn primary">ثبت</button></div></form>`)}
function addLog(){db.logs.push({id:Date.now(),title:lt.value,duration:+ld.value||0,type:ly.value,date:Date.now()});save();closeModal();render();toast('فعالیت ثبت شد ✓')}
function saveSettings(){db.settings.name=setName.value;db.settings.target=setTarget.value;db.settings.university=setUni.value;db.settings.finalAvg=setAvg.value;save();render();toast('تنظیمات ذخیره شد')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='amir-academic-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db={...base,...JSON.parse(r.result)};save();render();toast('بکاپ بازیابی شد ✓')}catch{alert('فایل JSON معتبر نیست.')}};r.readAsText(f)}
function resetData(){if(confirm('تمام اطلاعات پاک شود؟ این کار قابل بازگشت نیست.')){localStorage.removeItem(KEY);db=structuredClone(base);render();toast('اطلاعات بازنشانی شد')}}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function render(){nav();document.getElementById('dateLabel').textContent=today();document.getElementById('topTitle').textContent=(navItems.find(x=>x[0]===route)||navItems[0])[2];document.getElementById('content').innerHTML=execute()}
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'home';render()});render();
</script></body></html>
